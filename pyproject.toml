[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xianniu-linux-experimental"
version = "0.1.0"
description = "Experimental interoperability adapter for one observed Xianniu classic mode"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
xianniu-linux = "xianniu_linux.__main__:main"

[tool.setuptools.packages.find]
include = ["xianniu_linux*"]
